name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The job name is the required status check on main - renaming it breaks
  # the branch ruleset.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Starts a real Postgres with Testcontainers; Docker is preinstalled on
      # GitHub's Ubuntu runners.
      - run: npm run test:e2e
